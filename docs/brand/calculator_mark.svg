<!--
  Mosaic Calculator.

  A display strip over a keypad. Six keys rather than nine: at 48px an
  mdpi render of a 3x3 grid closes up into a texture, and the whole
  point is that it reads as *keys* rather than as a grid.

  Keep in sync with CALC_BASE / CALC_INK in
  tools/render_brand_icons.py, which is what actually generates the PNGs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <rect x="6" y="6" width="84" height="84" fill="#8B5CF6"/>

  <rect x="18" y="18" width="60" height="16" fill="#FFFFFF"/>

  <rect x="18" y="44" width="16" height="14" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="40" y="44" width="16" height="14" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="62" y="44" width="16" height="14" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="18" y="64" width="16" height="14" fill="#FFFFFF" fill-opacity="0.7"/>
  <rect x="40" y="64" width="16" height="14" fill="#FFFFFF" fill-opacity="0.7"/>
  <rect x="62" y="64" width="16" height="14" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>
