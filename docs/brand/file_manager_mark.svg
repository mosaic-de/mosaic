<!--
  Mosaic Files.

  Folder tab plus body, with two sheets of unequal height inside. The
  uneven sheets are load-bearing: matched, the mark reads as a plain
  rounded rectangle with two holes rather than as a folder holding
  documents.

  Keep in sync with FILES_BASE / FILES_INK in
  tools/render_brand_icons.py, which is what actually generates the PNGs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <rect x="6" y="16" width="36" height="12" fill="#10B981" fill-opacity="0.72"/>
  <rect x="6" y="28" width="84" height="62" fill="#10B981"/>

  <rect x="18" y="42" width="30" height="36" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="52" y="42" width="26" height="28" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
