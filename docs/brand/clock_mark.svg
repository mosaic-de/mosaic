<!--
  Mosaic Clock.

  A gapless four-quadrant face with the hands knocked out in white. The
  quadrants must stay flush: spaced like the general Mosaic tessellation,
  their gutters run corner to corner through the middle and compete with
  the hands, and the mark reads as a four-pane window.

  Hands read 3:00, not the conventional 10:10, because 10:10 needs
  diagonals and this language is axis-aligned only. Orthogonal hands also
  survive the 48px mdpi render without anti-aliasing mush.

  Keep in sync with CLOCK_BASE / CLOCK_INK in tools/render_brand_icons.py,
  which is what actually generates the PNGs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <rect x="6"  y="6"  width="42" height="42" fill="#EF4444"/>
  <rect x="48" y="6"  width="42" height="42" fill="#EF4444" fill-opacity="0.72"/>
  <rect x="6"  y="48" width="42" height="42" fill="#EF4444" fill-opacity="0.58"/>
  <rect x="48" y="48" width="42" height="42" fill="#EF4444" fill-opacity="0.88"/>

  <rect x="42" y="22" width="12" height="28" fill="#FFFFFF"/>
  <rect x="48" y="42" width="32" height="12" fill="#FFFFFF"/>
  <rect x="40" y="40" width="16" height="16" fill="#FFFFFF"/>
</svg>
