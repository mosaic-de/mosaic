<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- 4-tile arrangement, deliberately uneven, hinting at the
       semantic-tile vocabulary (Hero, Wide, Medium, Small). -->
  <rect x="6"  y="6"  width="40" height="40" fill="#00B7C3"/>
  <rect x="50" y="6"  width="40" height="22" fill="#00B7C3" fill-opacity="0.7"/>
  <rect x="50" y="32" width="18" height="14" fill="#00B7C3" fill-opacity="0.45"/>
  <rect x="72" y="32" width="18" height="14" fill="#00B7C3" fill-opacity="0.85"/>
  <rect x="6"  y="50" width="22" height="40" fill="#00B7C3" fill-opacity="0.55"/>
  <rect x="32" y="50" width="58" height="18" fill="#00B7C3" fill-opacity="0.9"/>
  <rect x="32" y="72" width="26" height="18" fill="#00B7C3" fill-opacity="0.35"/>
  <rect x="62" y="72" width="28" height="18" fill="#00B7C3" fill-opacity="0.65"/>
</svg>
